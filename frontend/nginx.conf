server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    charset utf-8;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' ws: wss:" always;

    location = /health/live {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(?:js|css|woff2?|svg|png|jpe?g|webp|ico|wasm)$ {
        try_files $uri =404;
        expires 1h;
    }

    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
