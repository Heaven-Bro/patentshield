x-django-environment: &django-environment
  DJANGO_DEBUG: "True"
  ENVIRONMENT: "local"

  DJANGO_SECRET_KEY: "${DJANGO_SECRET_KEY:?Set DJANGO_SECRET_KEY in .env}"

  ALLOWED_HOSTS: "localhost,127.0.0.1,api,worker,beat,embedding_worker"

  DB_HOST: "postgres"
  DB_PORT: "5432"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "${POSTGRES_DB:-patentshield}"
  POSTGRES_USER: "${POSTGRES_USER:-postgres}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

  REDIS_URL: "redis://redis:6379/0"
  REDIS_CACHE_URL: "redis://redis:6379/1"
  CHANNELS_REDIS_URL: "redis://redis:6379/0"
  CELERY_BROKER_URL: "redis://redis:6379/0"
  CELERY_RESULT_BACKEND: "redis://redis:6379/0"

  CORS_ALLOW_ALL_ORIGINS: "True"
  CORS_ALLOW_CREDENTIALS: "True"

  CORS_ALLOWED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000"

  CSRF_TRUSTED_ORIGINS: "http://localhost:8080,http://127.0.0.1:8080,http://localhost:8000"

services:

  # PostgreSQL + pgvector
  postgres:
    image: pgvector/pgvector:pg16
    pull_policy: missing
    restart: unless-stopped

    environment:
      POSTGRES_DB: "${POSTGRES_DB:-patentshield}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


  # Redis
  redis:
    image: redis:7-alpine
    pull_policy: missing
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s


  # Django ASGI API
  api:
    image: patentshield-api:local
    build:
      context: .
      dockerfile: Dockerfile

    pull_policy: never
    restart: unless-stopped

    command:
      - daphne
      - -b
      - 0.0.0.0
      - -p
      - "8000"
      - config.asgi:application

    ports:
      - "127.0.0.1:8000:8000"

    environment: *django-environment

    volumes:
      - ./media:/app/media

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import socket; s=socket.create_connection(('127.0.0.1', 8000), 3); s.close()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s


  # Celery Default & Core Worker (analyses and reports added)
  worker:
    image: patentshield-api:local
    pull_policy: never
    restart: unless-stopped

    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - INFO
      - -Q
      - default,ingestion,analysis,exports,external_search,office_actions,surveillance,fto,landscapes,analyses,reports

    environment: *django-environment

    volumes:
      - ./media:/app/media

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # Celery Embedding Worker
  embedding_worker:
    image: patentshield-api:local
    pull_policy: never
    restart: unless-stopped

    command:
      - celery
      - -A
      - config
      - worker
      - -l
      - INFO
      - -Q
      - embedding,embeddings

    environment: *django-environment

    volumes:
      - ./media:/app/media

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # Celery Beat
  beat:
    image: patentshield-api:local
    pull_policy: never
    restart: unless-stopped

    command:
      - celery
      - -A
      - config
      - beat
      - -l
      - INFO
      - --schedule=/tmp/patentshield-celerybeat-schedule

    environment: *django-environment

    volumes:
      - ./media:/app/media

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy


  # React + Nginx Frontend
  frontend:
    image: patentshield-frontend:local
    pull_policy: never
    restart: unless-stopped

    ports:
      - "127.0.0.1:8080:8080"

    build:
      context: .
      dockerfile: frontend/Dockerfile

      args:
        NODE_BUILD_BASE: node:22-alpine
        NGINX_RUNTIME_BASE: nginx:alpine

        VITE_API_BASE_URL: /
        VITE_WS_BASE_URL: /

    depends_on:
      api:
        condition: service_healthy

    tmpfs:
      - /var/cache/nginx:rw,noexec,nosuid,size=16m,mode=1777
      - /var/run:rw,noexec,nosuid,size=4m,mode=1777
      - /tmp:rw,noexec,nosuid,size=16m,mode=1777

    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s


volumes:
  postgres_data:
  redis_data: