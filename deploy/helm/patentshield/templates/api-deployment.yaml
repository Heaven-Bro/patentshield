apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-api
  labels:
    {{- include "patentshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.replicas.api }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: patentshield
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: patentshield
        app.kubernetes.io/component: api
      annotations:
        patentshield.openai.com/runtime-mode: "air-gapped"
        patentshield.openai.com/image-digest: {{ .Values.image.digest | quote }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "patentshield.podSecurityContext" . | nindent 8 }}
      containers:
        - name: api
          image: {{ include "patentshield.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef:
                name: {{ .Values.runtimeSecret }}
          env:
            - { name: PATENTSHIELD_OFFLINE_MODE, value: "true" }
            - { name: PATENTSHIELD_EXTERNAL_SEARCH_ENABLED, value: "false" }
            - { name: PATENTSHIELD_TRANSLATION_ENABLED, value: "false" }
            - { name: PATENTSHIELD_SURVEILLANCE_ENABLED, value: "false" }
            - { name: PATENTSHIELD_STORAGE_BACKEND, value: {{ .Values.storage.backend | quote }} }
            - { name: PATENTSHIELD_BGE_MODEL_PATH, value: "/models/bge-m3" }
            - { name: PATENTSHIELD_RERANKER_MODEL_PATH, value: "/models/reranker" }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_TELEMETRY, value: "1" }
            - { name: HF_HOME, value: "/tmp/huggingface" }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if eq .Values.storage.backend "filesystem" }}
            - { name: media, mountPath: /app/media }
            {{- end }}
          readinessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          securityContext:
            {{- include "patentshield.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.modelBundle.modelClaim }}
        - name: tmp
          emptyDir: { sizeLimit: 2Gi }
        {{- if eq .Values.storage.backend "filesystem" }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.storage.filesystemClaim }}
        {{- end }}
