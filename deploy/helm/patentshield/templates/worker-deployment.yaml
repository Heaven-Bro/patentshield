apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    {{- include "patentshield.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: {{ .Values.replicas.worker }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: patentshield
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: patentshield
        app.kubernetes.io/component: worker
    spec:
      automountServiceAccountToken: false
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "patentshield.podSecurityContext" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "patentshield.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["celery", "-A", "config", "worker", "-Q", "ingestion,embedding,analysis,external_search,exports", "--loglevel=INFO"]
          envFrom:
            - secretRef:
                name: {{ .Values.runtimeSecret }}
          env:
            - { name: PATENTSHIELD_OFFLINE_MODE, value: "true" }
            - { name: PATENTSHIELD_EXTERNAL_SEARCH_ENABLED, value: "false" }
            - { name: PATENTSHIELD_TRANSLATION_ENABLED, value: "false" }
            - { name: PATENTSHIELD_SURVEILLANCE_ENABLED, value: "false" }
            - { name: PATENTSHIELD_STORAGE_BACKEND, value: {{ .Values.storage.backend | quote }} }
            - { name: PATENTSHIELD_BGE_MODEL_PATH, value: "/models/bge-m3" }
            - { name: PATENTSHIELD_RERANKER_MODEL_PATH, value: "/models/reranker" }
            - { name: HF_HUB_OFFLINE, value: "1" }
            - { name: TRANSFORMERS_OFFLINE, value: "1" }
            - { name: HF_HUB_DISABLE_TELEMETRY, value: "1" }
            - { name: HF_HOME, value: "/tmp/huggingface" }
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
            - { name: tmp, mountPath: /tmp }
            {{- if eq .Values.storage.backend "filesystem" }}
            - { name: media, mountPath: /app/media }
            {{- end }}
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "kill -0 1"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - >-
                  celery -A config inspect ping --destination="celery@$(hostname)"
                  --timeout=3 2>/dev/null | grep -qi pong
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 2
          resources:
            {{- toYaml .Values.resources.worker | nindent 12 }}
          securityContext:
            {{- include "patentshield.containerSecurityContext" . | nindent 12 }}
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: {{ .Values.modelBundle.modelClaim }}
        - name: tmp
          emptyDir: { sizeLimit: 4Gi }
        {{- if eq .Values.storage.backend "filesystem" }}
        - name: media
          persistentVolumeClaim:
            claimName: {{ .Values.storage.filesystemClaim }}
        {{- end }}
