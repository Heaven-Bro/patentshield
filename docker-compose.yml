name: patentshield

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patentshield}
      POSTGRES_USER: ${POSTGRES_USER:-patentshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    # Local loopback only; production deployments should remove host port publishing.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    # Local loopback only; production deployments should remove host port publishing.
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML_DEPS: ${PATENTSHIELD_BUILD_ML_WORKER:-0}
        INSTALL_DEV_DEPS: ${PATENTSHIELD_BUILD_DEV_DEPS:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your repository-root .env file}
      HF_HOME: /models/huggingface
      PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_PRELOAD_ON_STARTUP: ${PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_PRELOAD_ON_STARTUP:-false}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/3}
      CHANNELS_REDIS_URL: ${CHANNELS_REDIS_URL:-redis://redis:6379/4}
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    # Bind only to loopback; production should route through a TLS ingress/proxy.
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend:/app
      - ml_model_cache:/models/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=6)"
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML_DEPS: ${PATENTSHIELD_BUILD_ML_WORKER:-0}
        INSTALL_DEV_DEPS: ${PATENTSHIELD_BUILD_DEV_DEPS:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your repository-root .env file}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/3}
      CHANNELS_REDIS_URL: ${CHANNELS_REDIS_URL:-redis://redis:6379/4}
      HF_HOME: /models/huggingface
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - ingestion,analysis,external_search,exports
      - --concurrency=${PATENTSHIELD_CELERY_WORKER_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25}
      - --loglevel=INFO
    volumes:
      - ./backend:/app
      - ml_model_cache:/models/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A config inspect ping --destination="celery@$${HOSTNAME}"
          --timeout=3 2>/dev/null | grep -qi pong
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Transformer models are resident per worker process. Keep the embedding
  # queue isolated and single-concurrency by default to avoid host OOM/VRAM spikes.
  embedding_worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_ML_DEPS: ${PATENTSHIELD_BUILD_ML_WORKER:-0}
        INSTALL_DEV_DEPS: ${PATENTSHIELD_BUILD_DEV_DEPS:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your repository-root .env file}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/3}
      CHANNELS_REDIS_URL: ${CHANNELS_REDIS_URL:-redis://redis:6379/4}
      HF_HOME: /models/huggingface
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - embedding
      - --concurrency=${PATENTSHIELD_EMBEDDING_WORKER_CONCURRENCY:-1}
      - --prefetch-multiplier=1
      - --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10}
      - --loglevel=INFO
    volumes:
      - ./backend:/app
      - ml_model_cache:/models/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A config inspect ping --destination="celery@$${HOSTNAME}"
          --timeout=3 2>/dev/null | grep -qi pong
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  beat:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        INSTALL_DEV_DEPS: ${PATENTSHIELD_BUILD_DEV_DEPS:-0}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your repository-root .env file}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/patentshield-celerybeat-schedule
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  ml_model_cache:
