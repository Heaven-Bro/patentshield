name: patentshield

services:
  postgres:
    image: ${PATENTSHIELD_POSTGRES_IMAGE:?Set PATENTSHIELD_POSTGRES_IMAGE to an imported digest-pinned pgvector image}
    pull_policy: never
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patentshield}
      POSTGRES_USER: ${POSTGRES_USER:-patentshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: ${PATENTSHIELD_REDIS_IMAGE:?Set PATENTSHIELD_REDIS_IMAGE to an imported digest-pinned Redis image}
    pull_policy: never
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    image: ${PATENTSHIELD_BACKEND_IMAGE:?Set PATENTSHIELD_BACKEND_IMAGE to the imported digest-pinned backend image}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your repository-root .env file}
      HF_HOME: /tmp/huggingface
      PATENTSHIELD_OFFLINE_MODE: "true"
      PATENTSHIELD_EXTERNAL_SEARCH_ENABLED: "false"
      PATENTSHIELD_TRANSLATION_ENABLED: "false"
      PATENTSHIELD_SURVEILLANCE_ENABLED: "false"
      PATENTSHIELD_CONNECTOR_SYNC_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PATENTSHIELD_BGE_MODEL_PATH: /models/bge-m3
      PATENTSHIELD_RERANKER_MODEL_PATH: /models/reranker
      PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_PRELOAD_ON_STARTUP: ${PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_PRELOAD_ON_STARTUP:-false}
      PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_CACHE_DIR: /models/fastembed-cache
      PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_LOCAL_FILES_ONLY: "true"
      PATENTSHIELD_MODEL_BUNDLE_MANIFEST: /models/patentshield-model-bundle-manifest.json
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/3}
      CHANNELS_REDIS_URL: ${CHANNELS_REDIS_URL:-redis://redis:6379/4}
    command: ["daphne", "-b", "0.0.0.0", "-p", "8000", "config.asgi:application"]
    volumes:
      - ${PATENTSHIELD_INSTALLED_MODELS_DIR:-./offline/installed-models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready/', timeout=6)"
      interval: 10s
      timeout: 7s
      retries: 5
      start_period: 15s

  frontend:
    image: ${PATENTSHIELD_FRONTEND_IMAGE:?Set PATENTSHIELD_FRONTEND_IMAGE to the imported digest-pinned frontend image}
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./deploy/airgap/nginx-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy

  worker:
    image: ${PATENTSHIELD_BACKEND_IMAGE:?Set PATENTSHIELD_BACKEND_IMAGE to the imported digest-pinned backend image}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your repository-root .env file}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/3}
      CHANNELS_REDIS_URL: ${CHANNELS_REDIS_URL:-redis://redis:6379/4}
      HF_HOME: /tmp/huggingface
      PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_CACHE_DIR: /models/fastembed-cache
      PATENTSHIELD_OFFLINE_MODE: "true"
      PATENTSHIELD_EXTERNAL_SEARCH_ENABLED: "false"
      PATENTSHIELD_TRANSLATION_ENABLED: "false"
      PATENTSHIELD_SURVEILLANCE_ENABLED: "false"
      PATENTSHIELD_CONNECTOR_SYNC_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PATENTSHIELD_BGE_MODEL_PATH: /models/bge-m3
      PATENTSHIELD_RERANKER_MODEL_PATH: /models/reranker
      PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_LOCAL_FILES_ONLY: "true"
      PATENTSHIELD_MODEL_BUNDLE_MANIFEST: /models/patentshield-model-bundle-manifest.json
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - ingestion,analysis,external_search,exports
      - --concurrency=${PATENTSHIELD_CELERY_WORKER_CONCURRENCY:-2}
      - --prefetch-multiplier=1
      - --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-25}
      - --loglevel=INFO
    volumes:
      - ${PATENTSHIELD_INSTALLED_MODELS_DIR:-./offline/installed-models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A config inspect ping --destination="celery@$${HOSTNAME}"
          --timeout=3 2>/dev/null | grep -qi pong
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Transformer models are resident per worker process. Keep the embedding
  # queue isolated and single-concurrency by default to avoid host OOM/VRAM spikes.
  embedding_worker:
    image: ${PATENTSHIELD_BACKEND_IMAGE:?Set PATENTSHIELD_BACKEND_IMAGE to the imported digest-pinned backend image}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your repository-root .env file}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/3}
      CHANNELS_REDIS_URL: ${CHANNELS_REDIS_URL:-redis://redis:6379/4}
      HF_HOME: /tmp/huggingface
      PATENTSHIELD_OFFLINE_MODE: "true"
      PATENTSHIELD_EXTERNAL_SEARCH_ENABLED: "false"
      PATENTSHIELD_TRANSLATION_ENABLED: "false"
      PATENTSHIELD_SURVEILLANCE_ENABLED: "false"
      PATENTSHIELD_CONNECTOR_SYNC_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      PATENTSHIELD_BGE_MODEL_PATH: /models/bge-m3
      PATENTSHIELD_RERANKER_MODEL_PATH: /models/reranker
      PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_CACHE_DIR: /models/fastembed-cache
      PATENTSHIELD_PUBLIC_PATENT_EMBEDDING_LOCAL_FILES_ONLY: "true"
      PATENTSHIELD_MODEL_BUNDLE_MANIFEST: /models/patentshield-model-bundle-manifest.json
    command:
      - celery
      - -A
      - config
      - worker
      - -Q
      - embedding
      - --concurrency=${PATENTSHIELD_EMBEDDING_WORKER_CONCURRENCY:-1}
      - --prefetch-multiplier=1
      - --max-tasks-per-child=${CELERY_WORKER_MAX_TASKS_PER_CHILD:-10}
      - --loglevel=INFO
    volumes:
      - ${PATENTSHIELD_INSTALLED_MODELS_DIR:-./offline/installed-models}:/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          celery -A config inspect ping --destination="celery@$${HOSTNAME}"
          --timeout=3 2>/dev/null | grep -qi pong
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  beat:
    image: ${PATENTSHIELD_BACKEND_IMAGE:?Set PATENTSHIELD_BACKEND_IMAGE to the imported digest-pinned backend image}
    pull_policy: never
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in your repository-root .env file}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/2}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis:6379/1}
      PATENTSHIELD_OFFLINE_MODE: "true"
      PATENTSHIELD_EXTERNAL_SEARCH_ENABLED: "false"
      PATENTSHIELD_TRANSLATION_ENABLED: "false"
      PATENTSHIELD_SURVEILLANCE_ENABLED: "false"
      PATENTSHIELD_CONNECTOR_SYNC_ENABLED: "false"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=INFO
      - --schedule=/tmp/patentshield-celerybeat-schedule
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
